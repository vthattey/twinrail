name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and check formatting
        run: ./gradlew build spotlessCheck --no-daemon
      - name: Same responses across JVM launches
        if: runner.os == 'Linux'
        run: |
          ./gradlew :server:installDist --no-daemon
          scripts/determinism-check.sh

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t twinrail:ci .
      - name: Start it, smoke test it, record size and start-up time
        run: scripts/image-check.sh twinrail:ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testcontainers module against the image
        run: TWINRAIL_IMAGE=twinrail:ci ./gradlew :testcontainers:test --no-daemon
      - name: Example project against the image
        run: |
          ./gradlew :testcontainers:publishToMavenLocal --no-daemon
          TWINRAIL_IMAGE=twinrail:ci ./gradlew -p examples/junit5 test --no-daemon
