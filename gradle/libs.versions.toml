[versions]
junit = "6.1.3"
spotless = "8.11.0"
prowide = "SRU2025-10.4.1"
gson = "2.14.0"
jaxb = "4.0.6"
snakeyaml-engine = "3.2"
json-schema-validator = "3.0.9"
javalin = "6.7.0"
slf4j = "2.0.17"
testcontainers = "2.0.5"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

prowide-iso20022 = { module = "com.prowidesoftware:pw-iso20022", version.ref = "prowide" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jaxb-runtime = { module = "org.glassfish.jaxb:jaxb-runtime", version.ref = "jaxb" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
